# Terminal: tmux doesn't pick up Ghostty's Smulx, so undercurl needs pinning
set -as terminal-features ',xterm-ghostty:RGB:usstyle:hyperlinks'

# Mouse
set -g mouse on

# Windows/panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10

# Killing a session switches to another one instead of dropping out of tmux
set -g detach-on-destroy off

# New windows and splits open where the current pane is
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Resize panes, -r so the key repeats without the prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Agents layout: new window, 1 tall left pane + 2 stacked on the right (prefix + A)
bind-key A new-window -c "#{pane_current_path}" -n agents \; \
  split-window -h -c "#{pane_current_path}" \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -t 1

# Pair layout: 3 shells side by side (prefix + W)
bind W new-window -c "#{pane_current_path}" -n pair \; \
  split-window -h -c "#{pane_current_path}" \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-layout even-horizontal \; \
  select-pane -t 1

# Popups: session switcher (prefix + S), lazygit (prefix + g), btop (prefix + B)
bind S display-popup -E -w 60% -h 50% \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazygit
bind B display-popup -E -w 90% -h 90% btop
bind P display-popup -E -w 70% -h 60% ~/.local/bin/tmux-sessionizer

# Pick a URL off the visible scrollback (plain text ones; OSC 8 links are clickable)
bind u display-popup -E -w 70% -h 50% \
  "tmux capture-pane -p -S -3000 | grep -oE 'https?://[^ \"]+' | sort -u | fzf --reverse --prompt='url> ' | xargs -r open"

# Toggle a persistent scratch session over the notes tree
bind T if-shell -F '#{==:#{session_name},scratch}' detach-client \
  'new-session -A -s scratch -c ~/github.com/Exotica0122/dotfile-agents/notes'

# Pane borders: label each pane with its Claude session name (falls back to the
# running command for plain shells)
set -g pane-border-status top
set -g pane-border-format ' #{?pane_active,#[fg=black bg=green bold],#[fg=green]} #{pane_index} #[default] #{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host_short}}},#[fg=white]#{pane_current_command},#{pane_title}} '
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=green'

# Vi-mode copy (y and mouse-drag yank come from tmux-yank)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection

# Status line
set -g status-style 'fg=white bg=default'
set -g status-left-length 30
set -g status-left '#[fg=green,bold]#S #[fg=white]│ '
set -g status-right-length 100
set -g status-right '#(~/.local/bin/tmux-status "#{pane_current_path}") #[fg=yellow]%H:%M'
set -g window-status-current-style 'fg=black bg=green bold'

# Plugins (managed by TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-continuum: auto-restore last session on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# tmux-resurrect only respawns whitelisted programs, so name the ones we run
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes '"~claude" "~opencode" nvim'

# Move window to index, shifting others up
bind M command-prompt -p "move to:" "move-window -b -t '%%'"

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
