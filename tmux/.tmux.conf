# Mouse
set -g mouse on

# Windows/panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10

# Vi-mode copy (yank to macOS clipboard)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'

# Status line
set -g status-style 'fg=white bg=default'
set -g status-left-length 30
set -g status-left '#[fg=green,bold]#S #[fg=white]│ '
set -g status-right-length 60
set -g status-right '#[fg=cyan]#(cd "#{pane_current_path}" && git branch --show-current 2>/dev/null) #[fg=white]│ #[fg=yellow]%H:%M'
set -g window-status-current-style 'fg=black bg=green bold'

# Plugins (managed by TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-continuum: auto-restore last session on tmux start
set -g @continuum-restore 'on'

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
